<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Resident - Barangay System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">Barangay Request System</a>
            <div class="navbar-nav flex-row flex-wrap align-items-center">
                <a class="nav-link" href="/">Home</a>
                <!-- Resident Request link removed from navbar -->
                <a class="nav-link" href="/resident_requests">Resident Requests {% if pending_requests_count > 0 %}<span class="badge rounded-pill bg-danger">{{ pending_requests_count }}</span>{% endif %}</a>
                <a class="nav-link" href="/announcements">Announcements</a>
                <a class="nav-link" href="/track">Track Request</a>
                {% if session.admin_logged_in or session.logged_in %}
                <a class="nav-link" href="/logout">Logout</a>
                {% else %}
                <a class="nav-link" href="/admin/login">Admin Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Add New Resident</h1>
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" id="age" name="age" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" required>
            </div>
            <div class="mb-3">
                <label for="contact" class="form-label">Contact</label>
                <input type="text" class="form-control" id="contact" name="contact" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Resident</button>
            <a href="/residents" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
